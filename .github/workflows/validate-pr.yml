name: Validate pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Astro site
        run: npm run build
        env:
          NODE_ENV: production
          PUBLIC_SUPABASE_URL: https://api.algofrog.in
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_IIIsziBlBINYSfTBtHyY4g_9i_pJmCs
          PUBLIC_AUTH_REDIRECT_ORIGIN: https://algofrog.in
          PUBLIC_APP_VERSION: pr-validation
